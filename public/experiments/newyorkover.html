<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWYORKOVER - 3D Magazine Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #F9F8F6;
            overflow: hidden;
            color: #1a1a1a;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 左侧侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 22%;
            height: 100vh;
            padding: 60px 40px;
            z-index: 10;
            background: linear-gradient(90deg, rgba(249,248,246,0.95) 0%, rgba(249,248,246,0) 100%);
            display: flex;
            flex-direction: column;
        }

        .title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 30px;
            color: #1a1a1a;
        }

        .intro {
            font-size: 14px;
            line-height: 1.8;
            color: #666;
            margin-bottom: 60px;
            max-width: 280px;
        }

        .menu-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #999;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .view-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .view-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 16px 20px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: #666;
            position: relative;
            overflow: hidden;
        }

        .view-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: #1a1a1a;
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .view-btn:hover {
            border-color: #1a1a1a;
            color: #1a1a1a;
        }

        .view-btn.active {
            background: #1a1a1a;
            color: #F9F8F6;
            border-color: #1a1a1a;
        }

        .view-btn.active::before {
            transform: scaleY(1);
        }

        /* 右下角信息面板 */
        .info-panel {
            position: fixed;
            right: 40px;
            bottom: 40px;
            width: 320px;
            padding: 30px;
            background: rgba(255,255,255,0.95);
            border: 1px solid #e0e0e0;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .info-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-date {
            font-size: 11px;
            letter-spacing: 2px;
            color: #999;
            margin-bottom: 12px;
        }

        .info-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 16px;
            color: #1a1a1a;
        }

        .info-artist {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
        }

        .info-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #888;
        }

        /* 加载动画 */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F9F8F6;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-text {
            font-family: 'Times New Roman', Times, serif;
            font-size: 48px;
            letter-spacing: 12px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 提示框 */
        .tooltip {
            position: fixed;
            padding: 8px 16px;
            background: #1a1a1a;
            color: #F9F8F6;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 20;
        }

        .tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loader">
        <div class="loader-text">NEWYORKOVER</div>
    </div>

    <!-- 3D 画布容器 -->
    <div id="canvas-container"></div>

    <!-- 左侧侧边栏 -->
    <aside class="sidebar">
        <h1 class="title">NEWYORKOVER</h1>
        <p class="intro">A curated collection of magazine covers spanning decades of visual storytelling. Explore the evolution of design through an immersive 3D experience.</p>
        <div class="menu-label">SELECT PERSPECTIVE</div>
        <div class="view-buttons">
            <button class="view-btn active" data-view="globe">GLOBE VIEW</button>
            <button class="view-btn" data-view="stacked">STACKED VIEW</button>
            <button class="view-btn" data-view="traditional">TRADITIONAL VIEW</button>
        </div>
    </aside>

    <!-- 右下角信息面板 -->
    <div class="info-panel">
        <div class="info-date"></div>
        <div class="info-title"></div>
        <div class="info-artist"></div>
        <div class="info-desc"></div>
    </div>

    <!-- 悬停提示框 -->
    <div class="tooltip"></div>

    <!-- 引入 Three.js 和 GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // ==================== 全局变量 ====================
        let scene, camera, renderer, controls;
        let magazines = [];
        let raycaster, mouse;
        let currentView = 'globe';
        let hoveredMagazine = null;
        let isAnimating = false;

        // 杂志数据
        const magazineData = [];
        const years = [];
        const titles = [
            'THE NEW AGE', 'URBAN RHYTHM', 'CITY LIGHTS', 'MODERN VISION',
            'FUTURE FORWARD', 'STREET SCENE', 'DESIGN REVOLUTION', 'CULTURAL SHIFT',
            'DIGITAL DAWN', 'CREATIVE WAVE', 'AESTHETIC JOURNEY', 'STYLISH TIMES',
            'ART & LIFE', 'CULTURE CLASH', 'METROPOLITAN', 'TIMELESS ELEGANCE',
            'GENESIS', 'HORIZON', 'SYNTHESIS', 'MANIFESTO',
            'VIVID', 'PRISM', 'ECHO', 'FUSION',
            'MOMENTUM', 'VERTEX', 'ZENITH', 'APEX',
            'NEXUS', 'POLYPHONY', 'KALEIDOSCOPE', 'CABINET',
            'ANTHOLOGY', 'COLLECTIVE', 'COMPENDIUM', 'ARCHIVE'
        ];
        const artists = [
            'Sarah Chen', 'Marcus Webb', 'Elena Voss', 'James Okonkwo',
            'Yuki Tanaka', 'Sofia Rossi', 'David Kim', 'Aisha Patel',
            'Lucas Fernandez', 'Nina Johansson', 'Omar Hassan', 'Emma Liu'
        ];
        const descriptions = [
            'Exploring the boundaries of contemporary design',
            'A visual journey through urban transformation',
            'Celebrating the intersection of art and technology',
            'Documenting the evolution of modern aesthetics',
            'Capturing the spirit of a new generation',
            'The future of creative expression unveiled'
        ];

        // 颜色调色板 - 复古杂志风格
        const colorPalettes = [
            '#E8D5B7', '#C4A77D', '#8B7355', '#2C3E50',
            '#E74C3C', '#3498DB', '#F39C12', '#9B59B6',
            '#1ABC9C', '#E67E22', '#34495E', '#16A085',
            '#D35400', '#2980B9', '#8E44AD', '#27AE60'
        ];

        // ==================== 初始化 ====================
        function init() {
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xF9F8F6);

            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.minDistance = 2;
            controls.maxDistance = 15;
            controls.enablePan = false;

            // 射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 生成杂志数据
            generateMagazineData(36);

            // 创建 3D 杂志
            createMagazines();

            // 事件监听
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);

            // 视图按钮事件
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const view = e.target.dataset.view;
                    if (view !== currentView && !isAnimating) {
                        switchView(view);
                    }
                });
            });

            // 初始位置 - Globe View
            positionGlobeView();

            // 隐藏加载动画
            setTimeout(() => {
                document.querySelector('.loader').classList.add('hidden');
            }, 1500);

            // 开始渲染循环
            animate();
        }

        // ==================== 数据生成 ====================
        function generateMagazineData(count) {
            const startYear = 1925;
            const endYear = 2025;
            const yearStep = Math.floor((endYear - startYear) / count);

            for (let i = 0; i < count; i++) {
                const year = startYear + i * yearStep + Math.floor(Math.random() * yearStep);
                const month = Math.floor(Math.random() * 12);
                const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

                magazineData.push({
                    id: i,
                    date: `${months[month]} ${Math.floor(Math.random() * 28) + 1}, ${year}`,
                    title: titles[i % titles.length],
                    artist: artists[Math.floor(Math.random() * artists.length)],
                    description: descriptions[Math.floor(Math.random() * descriptions.length)],
                    color: colorPalettes[i % colorPalettes.length],
                    year: year
                });
            }
        }

        // ==================== 创建杂志封面 ====================
        function createMagazines() {
            const geometry = new THREE.PlaneGeometry(1.4, 1.8);

            magazineData.forEach((data, index) => {
                // 创建材质 - 使用简单的几何图案
                const material = createMagazineMaterial(data.color, index);

                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { ...data, index: index };

                magazines.push(mesh);
                scene.add(mesh);
            });
        }

        // 创建杂志封面材质
        function createMagazineMaterial(baseColor, index) {
            const canvas = document.createElement('canvas');
            canvas.width = 280;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');

            // 背景
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 280, 360);

            // 几何图案设计
            const patterns = [
                // 图案 1: 圆形装饰
                () => {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(140, 120, 60, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.font = 'bold 48px Times New Roman';
                    ctx.textAlign = 'center';
                    ctx.fillText('NEW', 140, 130);
                    ctx.fillText('YORK', 140, 180);
                },
                // 图案 2: 条纹
                () => {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    for (let i = 0; i < 8; i++) {
                        ctx.fillRect(0, i * 50, 280, 20);
                    }
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.font = 'bold 36px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('VOL.', 140, 80);
                },
                // 图案 3: 对角线
                () => {
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 2;
                    for (let i = -280; i < 560; i += 20) {
                        ctx.beginPath();
                        ctx.moveTo(i, 0);
                        ctx.lineTo(i + 360, 360);
                        ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.font = 'bold 32px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('OVER', 140, 200);
                },
                // 图案 4: 中心方块
                () => {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillRect(90, 100, 100, 100);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.font = 'bold 24px Helvetica';
                    ctx.textAlign = 'center';
                    ctx.fillText('NY', 140, 155);
                },
                // 图案 5: 波浪
                () => {
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.ellipse(140, 80 + i * 50, 120 - i * 15, 15, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            ];

            patterns[index % patterns.length]();

            // 年份
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(magazineData[index].year.toString(), 15, 345);

            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        }

        // ==================== 视图位置计算 ====================

        /**
         * GLOBE VIEW - 斐波那契球面算法
         * 使用斐波那契螺旋将点均匀分布在球面上
         * 数学原理: phi = arccos(1 - 2*(i+0.5)/n), theta = pi*(1+sqrt(5))*i
         */
        function positionGlobeView() {
            const count = magazines.length;
            const radius = 3; // 球体半径

            magazines.forEach((mag, i) => {
                // 斐波那契球面算法
                const phi = Math.acos(1 - 2 * (i + 0.5) / count); // 极角
                const theta = Math.PI * (1 + Math.sqrt(5)) * i;    // 方位角

                // 球面坐标转笛卡尔坐标
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                // 计算朝向 - 面向球体外侧
                const normal = new THREE.Vector3(x, y, z).normalize();
                const quaternion = new THREE.Quaternion();
                const up = new THREE.Vector3(0, 1, 0);
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

                gsap.to(mag.position, {
                    x: x, y: y, z: z,
                    duration: 1.2,
                    ease: "power2.inOut"
                });

                gsap.to(mag.quaternion, {
                    x: quaternion.x, y: quaternion.y, z: quaternion.z, w: quaternion.w,
                    duration: 1.2,
                    ease: "power2.inOut"
                });
            });
        }

        /**
         * STACKED VIEW - 堆叠视图
         * 类似一叠扑克牌，每张卡片在 Z 轴上有微小偏移
         */
        function positionStackedView() {
            const count = magazines.length;
            const zSpacing = 0.015; // Z 轴间距
            const xOffset = 0.003;  // X 轴微小偏移
            const yOffset = 0.002;  // Y 轴微小偏移

            magazines.forEach((mag, i) => {
                // 越新的杂志越在前面 (i 越大越靠前)
                const z = -i * zSpacing;
                const x = (Math.random() - 0.5) * xOffset * i;
                const y = (Math.random() - 0.5) * yOffset * i;

                // 面向正前方
                gsap.to(mag.position, {
                    x: x, y: y, z: z + 0.5,
                    duration: 1.2,
                    ease: "power2.inOut"
                });

                gsap.to(mag.quaternion, {
                    x: 0, y: 0, z: 0, w: 1,
                    duration: 1.2,
                    ease: "power2.inOut"
                });
            });
        }

        /**
         * TRADITIONAL VIEW - 传统网格视图
         * 排列成扁平的 2D 网格
         */
        function positionTraditionalView() {
            const count = magazines.length;
            const cols = 6; // 列数
            const spacingX = 1.6;
            const spacingY = 2.0;

            magazines.forEach((mag, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const x = (col - (cols - 1) / 2) * spacingX;
                const y = -(row - Math.floor(count / cols) / 2) * spacingY;
                const z = 0;

                gsap.to(mag.position, {
                    x: x, y: y, z: z,
                    duration: 1.2,
                    ease: "power2.inOut"
                });

                gsap.to(mag.quaternion, {
                    x: 0, y: 0, z: 0, w: 1,
                    duration: 1.2,
                    ease: "power2.inOut"
                });
            });
        }

        // ==================== 视图切换 ====================
        function switchView(view) {
            if (isAnimating) return;
            isAnimating = true;
            currentView = view;

            // 更新按钮状态
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });

            // 隐藏信息面板
            document.querySelector('.info-panel').classList.remove('visible');
            hoveredMagazine = null;

            // 根据视图执行不同的位置计算
            switch (view) {
                case 'globe':
                    positionGlobeView();
                    controls.enableRotate = true;
                    break;
                case 'stacked':
                    positionStackedView();
                    controls.enableRotate = false;
                    camera.position.set(0, 0, 5);
                    controls.update();
                    break;
                case 'traditional':
                    positionTraditionalView();
                    controls.enableRotate = false;
                    camera.position.set(0, 0, 8);
                    controls.update();
                    break;
            }

            // 动画完成
            setTimeout(() => {
                isAnimating = false;
            }, 1300);
        }

        // ==================== 交互事件 ====================
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(magazines);

            const infoPanel = document.querySelector('.info-panel');
            const tooltip = document.querySelector('.tooltip');

            if (intersects.length > 0) {
                const intersected = intersects[0].object;

                if (hoveredMagazine !== intersected) {
                    // 恢复上一个悬停的杂志
                    if (hoveredMagazine) {
                        gsap.to(hoveredMagazine.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
                        gsap.to(hoveredMagazine.position, { z: hoveredMagazine.userData.originalZ || 0, duration: 0.3 });
                    }

                    hoveredMagazine = intersected;
                    hoveredMagazine.userData.originalZ = intersected.position.z;

                    // 悬停效果
                    if (currentView === 'globe') {
                        // 球体视图：向相机方向移动
                        const direction = new THREE.Vector3();
                        direction.subVectors(camera.position, intersected.position).normalize();
                        gsap.to(intersected.position, {
                            x: intersected.position.x + direction.x * 0.3,
                            y: intersected.position.y + direction.y * 0.3,
                            z: intersected.position.z + direction.z * 0.3,
                            duration: 0.3
                        });
                    } else if (currentView === 'traditional') {
                        // 传统视图：向上移动
                        gsap.to(intersected.position, {
                            y: intersected.position.y + 0.3,
                            duration: 0.3
                        });
                    } else if (currentView === 'stacked') {
                        // 堆叠视图：向右抽出
                        gsap.to(intersected.position, {
                            x: intersected.position.x + 1.5,
                            duration: 0.3
                        });
                    }

                    // 放大
                    gsap.to(intersected.scale, { x: 1.1, y: 1.1, z: 1.1, duration: 0.3 });

                    // 显示信息面板
                    const data = intersected.userData;
                    document.querySelector('.info-date').textContent = data.date;
                    document.querySelector('.info-title').textContent = data.title;
                    document.querySelector('.info-artist').textContent = `By ${data.artist}`;
                    document.querySelector('.info-desc').textContent = data.description;
                    infoPanel.classList.add('visible');

                    // 传统视图显示年份提示框
                    if (currentView === 'traditional') {
                        tooltip.textContent = data.year;
                        tooltip.style.left = event.clientX + 15 + 'px';
                        tooltip.style.top = event.clientY - 30 + 'px';
                        tooltip.classList.add('visible');
                    }
                }
            } else {
                // 恢复悬停状态
                if (hoveredMagazine) {
                    const originalZ = hoveredMagazine.userData.originalZ || 0;

                    gsap.to(hoveredMagazine.scale, { x: 1, y: 1, z: 1, duration: 0.3 });

                    if (currentView === 'globe') {
                        // 恢复球体位置需要重新计算
                        const i = hoveredMagazine.userData.index;
                        const count = magazines.length;
                        const radius = 3;
                        const phi = Math.acos(1 - 2 * (i + 0.5) / count);
                        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
                        const x = radius * Math.sin(phi) * Math.cos(theta);
                        const y = radius * Math.sin(phi) * Math.sin(theta);
                        const z = radius * Math.cos(phi);

                        gsap.to(hoveredMagazine.position, { x, y, z, duration: 0.3 });
                    } else if (currentView === 'traditional') {
                        const col = hoveredMagazine.userData.index % 6;
                        const row = Math.floor(hoveredMagazine.userData.index / 6);
                        const x = (col - 2.5) * 1.6;
                        const y = -(row - 2.5) * 2.0;
                        gsap.to(hoveredMagazine.position, { x, y, z: 0, duration: 0.3 });
                    } else if (currentView === 'stacked') {
                        const i = hoveredMagazine.userData.index;
                        gsap.to(hoveredMagazine.position, {
                            x: (Math.random() - 0.5) * 0.003 * i,
                            y: (Math.random() - 0.5) * 0.002 * i,
                            z: -i * 0.015 + 0.5,
                            duration: 0.3
                        });
                    }

                    hoveredMagazine = null;
                }

                infoPanel.classList.remove('visible');
                tooltip.classList.remove('visible');
            }
        }

        function onMouseClick(event) {
            // 可以添加点击事件
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== 渲染循环 ====================
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // 球体视图下的缓慢旋转
            if (currentView === 'globe' && !hoveredMagazine) {
                scene.rotation.y += 0.001;
            }

            renderer.render(scene, camera);
        }

        // ==================== 启动 ====================
        init();
    </script>
</body>
</html>
