<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具箱 · 泥巴猪的伊甸园</title>
<meta name="description" content="泥巴猪的工具箱 —— 神秘咒语盒、设计样板间，收集和实验的几样东西。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece4d9;--surface:#f4f0ea;--card:#fffbf5;--fg:#4f483e;
  --muted:#8a7d6b;--border:#e2d8cb;--accent:#f54001;--accent-soft:#ffc198;
  --shadow-card:0 8px 40px rgba(79,72,62,.08), 0 2px 20px rgba(79,72,62,.04);
  --shadow-hover:0 16px 64px rgba(79,72,62,.13);
  --font-display:'Playfair Display', Georgia, 'Songti SC', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --wrap:1180px;
}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:url('source/pic/index-pic.jpg');background-size:cover;background-position:center;
  background-attachment:fixed;
  background-blend-mode:luminosity;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:rgba(236,228,217,.52)}
body>*{position:relative;z-index:1}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

.img-ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(138,125,107,.05) 11px,rgba(138,125,107,.05) 12px),var(--card);
  border:1.5px dashed var(--border);border-radius:14px;color:var(--muted);padding:24px;min-height:180px;overflow:hidden}
.img-ph .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:#fff;border:1px solid var(--border);padding:3px 9px;border-radius:999px}
.img-ph .desc{font-size:13px;max-width:80%;line-height:1.5}

header.nav{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg) 52%,transparent);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--font-display);font-weight:700;font-size:18px}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a{font-size:14.5px;color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--fg)}
.nav-links a.active{color:var(--fg);font-weight:500}
.nav-toggle{display:none;background:none;border:0;color:var(--fg);font-size:22px;cursor:pointer}

.page-head{padding:64px 0 48px}
.page-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1.06;letter-spacing:-.015em;margin:14px 0 0}
.page-head p{color:var(--muted);font-size:17px;max-width:50ch;margin:16px 0 0}

/* image hero with embedded cards */
.hero-img-wrap{position:relative;border-radius:20px;overflow:hidden;margin-bottom:36px;
  box-shadow:var(--shadow-card)}
.hero-img-wrap img{display:block;width:100%;height:auto}
.hero-img-overlay{position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(79,72,62,.0) 40%,rgba(79,72,62,.55) 100%)}
.hero-cards{position:absolute;right:28px;bottom:24px;display:flex;gap:14px;z-index:2}
.hero-card{background:color-mix(in oklab,var(--card) 88%,transparent);
  backdrop-filter:blur(12px);border:1px solid color-mix(in oklab,var(--border) 70%,transparent);
  border-radius:14px;padding:18px 22px;width:260px;text-decoration:none;color:inherit;transition:.25s}
.hero-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);background:var(--card)}
.hero-card h3{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0 0 6px}
.hero-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 10px}
.hero-card .proj-tags span{font-family:var(--font-mono);font-size:10.5px;color:var(--fg);
  background:var(--surface);border:1px solid var(--border);padding:3px 8px;border-radius:6px}

footer{padding:44px 0;border-top:1px solid var(--border)}
.foot-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:13.5px}
.foot-inner .font-note{font-family:var(--font-mono);font-size:11.5px}

@media(max-width:880px){
  .nav-links{display:none}
  .hero-cards{flex-direction:column;right:16px;bottom:16px}
  .hero-card{width:220px}
}
@media(max-width:560px){.wrap{padding:0 20px}.page-head{padding:44px 0 32px}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><span class="mark">泥</span><b>泥巴猪的伊甸园</b></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="about.html">关于我</a>
      <a href="portfolio.html">作品集</a>
      <a href="blog.html">博客</a>
      <a href="toolbox.html" class="active">工具箱</a>
      <a href="tutorials.html">教程</a>
    </nav>
    <button class="nav-toggle" aria-label="菜单" onclick="document.querySelector('.nav-links').classList.toggle('open')">≡</button>
  </div>
</header>

<div class="page-head">
  <div class="wrap">
    <span class="eyebrow">工具箱 · Toolbox</span>
    <h1>收集和实验的几样东西。</h1>
    <p>提示词研究、设计实验——在做的过程中攒下来的小工具和好奇心。</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="hero-img-wrap">
      <img src="source/pic/index/工具箱.png" alt="工具箱">
      <div class="hero-img-overlay"></div>
      <div class="hero-cards">
        <a href="/prompts" class="hero-card proj-link">
          <h3>神秘咒语盒</h3>
          <p>收集主流 AI 工具的系统提示词与工具定义，探索不同 AI 的"思维方式"。</p>
          <div class="proj-tags"><span>提示词</span><span>系统架构</span></div>
        </a>
        <a href="/design-showcase" class="hero-card proj-link">
          <h3>设计样板间</h3>
          <p>归档前端设计样式与实验：组件库、排版系统、色彩方案、动效原型。</p>
          <div class="proj-tags"><span>UI/UX</span><span>组件库</span></div>
        </a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-inner">
    <span>&copy; 2026 泥巴猪的伊甸园 &middot; 用心做，慢慢长。</span>
    <span class="font-note">Playfair Display &middot; Inter &middot; JetBrains Mono</span>
  </div>
</footer>

<script>
document.querySelectorAll('a[href^="/"]').forEach(function(a){
  a.addEventListener('click',function(e){
    e.preventDefault();
    sessionStorage.setItem('redirect',this.getAttribute('href'));
    window.location.href='/app.html';
  });
});
</script>
</body>
</html>
